bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# enable copying via tmux-copy mode (only for linux wayland, as then wl-copy should be used). I guess in other terminals this works without setting the copy-tool, not 100% sure tho
if-shell 'test "$(uname)" = "Linux" && [ "$XDG_SESSION_TYPE" = "wayland" ]' "set -s copy-command 'wl-copy'"
